apiVersion: v2
name: wazuh
description: Wazuh is a free and open source security platform that unifies XDR and SIEM protection for endpoints and cloud workloads.
type: application
appVersion: 5.0.0
version: 3.0.0
annotations:
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: security
  artifacthub.io/changes: |
    - kind: changed
      description: "Wazuh 5.0.0 — major architectural update (breaking change, chart 3.0.0)"
    - kind: removed
      description: "Remove Filebeat sidecar from manager StatefulSets; 5.0 ships no Filebeat"
    - kind: removed
      description: "Remove filebeat-tls cert-manager Certificate and all filebeat env vars from managers"
    - kind: added
      description: "Add remoted-tls cert-manager Certificate for port 1514 agent event channel"
    - kind: added
      description: "Add authd-tls cert-manager Certificate for ports 1515 and 1517 agent enrollment"
    - kind: added
      description: "Add port 1517 (enrollment-https) to manager master Service for HTTPS agent enrollment"
    - kind: changed
      description: "indexer-cred INDEXER_USERNAME default changed from admin to wazuh-server"
    - kind: added
      description: "Add wazuh-server internal user to indexer securityconfig for manager→indexer auth"
    - kind: changed
      description: "ossec.conf auth ssl_manager_cert/key now references mounted authd-tls cert"
  artifacthub.io/links: |
    - name: application source
      url: https://github.com/wazuh/wazuh
    - name: kustomize source
      url: https://github.com/wazuh/wazuh-kubernetes
  artifacthub.io/screenshots: |
    - title: Home Page
      url: https://morgoved.github.io/wazuh-helm/images/dashboard.png
    - title: Agent Deployment
      url: https://morgoved.github.io/wazuh-helm/images/agent-deploy.png
    - title: Threat Hunting
      url: https://morgoved.github.io/wazuh-helm/images/threat-hunting.png
home: https://wazuh.com/
